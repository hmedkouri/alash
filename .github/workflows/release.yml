name: Release

# Prebuilt binaries for people who have no Rust toolchain. Triggered by pushing a v* tag.
# The last job publishes the crate to crates.io through Trusted Publishing: this workflow
# is registered on the crate's settings page, so no token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A published version cannot be replaced, so a tag that disagrees with the manifest
      # stops here, before anything is created.
      - name: Tag matches the manifest version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      # Notes come from the matching CHANGELOG.md section; the release fails without one.
      # A draft, because this repository has immutable releases on: a published release
      # accepts no more files. `publish-release` below publishes it once every archive is
      # attached. v0.1.0 was published first and so has no binaries.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are musl, so the binaries are statically linked and do not
          # inherit the runner's glibc version as a minimum requirement.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Experimental: built, never run on a real Windows machine, no PowerShell
          # integration yet.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: alash
          target: ${{ matrix.target }}
          archive: alash-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only when every target uploaded: a release missing a platform stays a draft.
  publish-release:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the GitHub release, so a version never reaches crates.io without its binaries.
  # crates.io gives a short-lived token to this workflow only; see the header.
  publish-crate:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
